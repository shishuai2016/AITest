<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Flow · 把今天过成一条清楚的线</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#" aria-label="Focus Flow 首页">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span>Focus <em>Flow</em></span>
    </a>
    <div class="today">
      <span id="dateLabel">—</span>
      <span class="dot" aria-hidden="true"></span>
      <span id="clockLabel">--:--</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel tasks" aria-labelledby="tasksTitle">
      <div class="panel-head">
        <div>
          <p class="eyebrow">TODAY'S LINE</p>
          <h1 id="tasksTitle">今天只做三件事</h1>
        </div>
        <div class="ring-wrap" aria-label="今日完成进度">
          <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="20" class="ring-bg"></circle>
            <circle id="ringValue" cx="24" cy="24" r="20" class="ring-value"></circle>
          </svg>
          <span id="ringText">0%</span>
        </div>
      </div>

      <form id="addForm" class="add-row" autocomplete="off">
        <label class="sr-only" for="taskInput">添加一个任务</label>
        <input id="taskInput" type="text" placeholder="下一件值得做的事…" maxlength="80">
        <button class="btn-add" type="submit" aria-label="添加任务">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </form>

      <div class="filters" role="tablist" aria-label="任务筛选">
        <button class="filter active" data-filter="all" role="tab" aria-selected="true">全部 <span id="countAll">0</span></button>
        <button class="filter" data-filter="open" role="tab" aria-selected="false">进行中</button>
        <button class="filter" data-filter="done" role="tab" aria-selected="false">已完成</button>
        <button class="clear" id="clearDone" type="button">清除已完成</button>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <div id="emptyState" class="empty" hidden>
        <p class="empty-glyph" aria-hidden="true">○</p>
        <p>列表空了。今天可以慢一点。</p>
      </div>

      <footer class="panel-foot">
        <span><strong id="doneCount">0</strong> 件已完成</span>
        <span class="quote">“把注意力留给值得的事。”</span>
      </footer>
    </section>

    <aside class="panel focus" aria-labelledby="focusTitle">
      <div class="focus-head">
        <p class="eyebrow">DEEP WORK</p>
        <h2 id="focusTitle">专注计时</h2>
      </div>

      <div class="timer">
        <svg class="timer-orbit" viewBox="0 0 260 260" aria-hidden="true">
          <circle cx="130" cy="130" r="118" class="orbit-bg"></circle>
          <circle id="orbitValue" cx="130" cy="130" r="118" class="orbit-value"></circle>
          <circle cx="130" cy="130" r="102" class="orbit-inner"></circle>
        </svg>
        <div class="timer-center">
          <span id="timerLabel" class="timer-label">FOCUS</span>
          <time id="timerValue" class="timer-value" datetime="PT25M">25:00</time>
          <span id="sessionHint" class="timer-hint">第 1 个专注段</span>
        </div>
      </div>

      <div class="timer-actions">
        <button id="startBtn" class="btn-primary" type="button">
          <span class="play-icon" aria-hidden="true"></span>
          <span id="startLabel">开始专注</span>
        </button>
        <button id="resetBtn" class="btn-ghost" type="button" aria-label="重置计时">重置</button>
      </div>

      <div class="mode-switch" role="group" aria-label="计时模式">
        <button class="mode active" data-mode="focus" type="button">25 分钟专注</button>
        <button class="mode" data-mode="break" type="button">5 分钟休息</button>
      </div>

      <dl class="stats">
        <div><dt>今日专注</dt><dd><span id="focusMinutes">0</span><small>分钟</small></dd></div>
        <div><dt>完成段数</dt><dd><span id="sessionCount">0</span><small>段</small></dd></div>
        <div><dt>完成率</dt><dd><span id="doneRate">0</span><small>%</small></dd></div>
      </dl>

      <p class="focus-note">关掉通知，把这一段时间交给眼前的事。计时结束会自动切到休息。</p>
    </aside>
  </main>

  <footer class="page-foot">
    <span>Focus Flow · 一个安静的个人效率工具</span>
    <button id="resetDemo" class="text-btn" type="button">恢复示例数据</button>
  </footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
