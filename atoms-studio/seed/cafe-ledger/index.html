<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光咖啡 · 小店流水</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 9h12v5.5A4.5 4.5 0 0 1 11.5 19h-3A4.5 4.5 0 0 1 4 14.5V9Z" stroke="currentColor" stroke-width="1.5"/><path d="M16 10.5h1.2a2.3 2.3 0 0 1 0 4.6H16M7 5.5c0-.8.8-1.4.8-2.2M10.5 5.5c0-.8.8-1.4.8-2.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </span>
      <div>
        <strong>拾光咖啡</strong>
        <span>SHIGUANG COFFEE · 小店流水</span>
      </div>
    </div>
    <div class="topbar-right">
      <span class="live"><i aria-hidden="true"></i> 营业中</span>
      <span id="todayDate" class="date">—</span>
      <button id="exportBtn" class="ghost-btn" type="button">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3v9m0 0 3.2-3.2M10 12 6.8 8.8M4 14.5V16h12v-1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        导出流水
      </button>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">TODAY'S REVENUE</p>
        <h1>今日流水</h1>
        <div class="revenue">
          <span class="currency">¥</span>
          <span id="todayRevenue">0</span>
          <span class="delta" id="revenueDelta">—</span>
        </div>
        <p class="hero-note" id="heroNote">今天已经卖出 0 杯，慢慢来。</p>
      </div>
      <div class="hero-chart" aria-hidden="true">
        <svg viewBox="0 0 360 120" preserveAspectRatio="none">
          <defs>
            <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#e0a96d" stop-opacity="0.36"/>
              <stop offset="100%" stop-color="#e0a96d" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path id="sparkArea" fill="url(#sparkFill)" d=""></path>
          <path id="sparkLine" fill="none" stroke="#e0a96d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d=""></path>
        </svg>
        <span>近 7 天营业趋势</span>
      </div>
    </section>

    <section class="kpis" aria-label="今日经营指标">
      <article class="kpi">
        <span class="kpi-label">订单数</span>
        <strong><span id="orderCount">0</span><small>单</small></strong>
        <span class="kpi-foot" id="orderFoot">今日累计</span>
      </article>
      <article class="kpi">
        <span class="kpi-label">客单价</span>
        <strong>¥<span id="avgTicket">0</span></strong>
        <span class="kpi-foot" id="avgFoot">—</span>
      </article>
      <article class="kpi">
        <span class="kpi-label">热销单品</span>
        <strong class="kpi-text" id="topItem">—</strong>
        <span class="kpi-foot" id="topItemFoot">等待第一杯</span>
      </article>
      <article class="kpi accent">
        <span class="kpi-label">本周流水</span>
        <strong>¥<span id="weekRevenue">0</span></strong>
        <span class="kpi-foot" id="weekFoot">—</span>
      </article>
    </section>

    <section class="grid">
      <div class="panel chart-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">TREND</p>
            <h2>一周流水</h2>
          </div>
          <div class="segmented" role="group" aria-label="图表时间范围">
            <button class="seg active" data-days="7" type="button">7 天</button>
            <button class="seg" data-days="14" type="button">14 天</button>
          </div>
        </div>
        <div id="barChart" class="bar-chart" role="img" aria-label="每日流水柱状图"></div>
        <div class="chart-legend"><span><i class="dot today"></i>今天</span><span><i class="dot"></i>往期</span><span class="chart-total" id="chartTotal">—</span></div>
      </div>

      <div class="panel add-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">NEW ORDER</p>
            <h2>记一笔</h2>
          </div>
          <span class="hint">回车快速提交</span>
        </div>
        <form id="orderForm" autocomplete="off">
          <label for="itemInput">商品</label>
          <input id="itemInput" type="text" placeholder="例：燕麦拿铁" maxlength="30">
          <div class="form-row">
            <div>
              <label for="amountInput">金额</label>
              <input id="amountInput" type="number" inputmode="decimal" min="1" step="0.5" placeholder="28">
            </div>
            <div>
              <label for="categoryInput">分类</label>
              <select id="categoryInput">
                <option>咖啡</option>
                <option>茶饮</option>
                <option>烘焙</option>
                <option>周边</option>
              </select>
            </div>
          </div>
          <p id="formError" class="form-error" role="alert"></p>
          <button class="primary-btn" type="submit">记入今日流水</button>
        </form>
        <p class="add-note">演示数据会保存在服务端，换一台设备打开也能看到。</p>
      </div>
    </section>

    <section class="panel orders-panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">TODAY'S ORDERS</p>
          <h2>今日订单</h2>
        </div>
        <div class="filters" id="filters" role="group" aria-label="按分类筛选">
          <button class="chip active" data-cat="all" type="button">全部</button>
          <button class="chip" data-cat="咖啡" type="button">咖啡</button>
          <button class="chip" data-cat="茶饮" type="button">茶饮</button>
          <button class="chip" data-cat="烘焙" type="button">烘焙</button>
          <button class="chip" data-cat="周边" type="button">周边</button>
          <button id="resetDemo" class="chip reset" type="button">恢复示例</button>
        </div>
      </div>
      <div class="table-head" aria-hidden="true"><span>时间</span><span>商品</span><span>分类</span><span class="right">金额</span><span></span></div>
      <ul id="orderList" class="order-list" aria-live="polite"></ul>
      <div id="ordersEmpty" class="orders-empty" hidden>今天还没有订单，去记一笔吧。</div>
    </section>
  </main>

  <footer class="footer">
    <span>拾光咖啡 · 一切经营都从一笔流水开始</span>
    <span id="savedHint">数据已同步</span>
  </footer>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
